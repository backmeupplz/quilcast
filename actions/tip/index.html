<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tip</title>
  <meta name="description" content="A Quilcast cast action: tip a Farcaster cast's author in USDC on Base." />
  <link rel="icon" href="/icon.png" />
  <meta name="theme-color" content="#0d0c11" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Quilcast" />
  <meta property="og:url" content="https://tip.quilcast.com/" />
  <meta property="og:title" content="Tip" />
  <meta property="og:description" content="A Quilcast cast action: tip a Farcaster cast's author in USDC on Base." />
  <meta property="og:image" content="https://quilcast.com/og-actions.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@quilcast" />
  <meta name="twitter:title" content="Tip" />
  <meta name="twitter:description" content="A Quilcast cast action: tip a Farcaster cast's author in USDC on Base." />
  <meta name="twitter:image" content="https://quilcast.com/og-actions.png" />
  <link rel="stylesheet" href="/style.css" />
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <h1>Tip</h1>
    <div id="cast" class="cast" hidden><img alt="" /><div><b></b><p></p></div></div>
    <div id="tip" hidden>
      <p class="muted">Send <span id="who"></span> USDC on Base. Your wallet asks you to confirm.</p>
      <div class="amounts">
        <button type="button" data-usd="1">$1</button>
        <button type="button" data-usd="5">$5</button>
        <button type="button" data-usd="10">$10</button>
      </div>
      <form id="other" class="other">
        <input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="Other amount ($)" aria-label="Other amount in dollars" />
        <button type="submit">Send</button>
      </form>
    </div>
    <p id="status" role="status"></p>
    <button id="note" type="button" hidden>Reply to say so</button>
  </main>
</body>
</html>
