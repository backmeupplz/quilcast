<body>
  <main>
    <h1>Spam check</h1>
    <div id="cast" class="cast" hidden><img alt="" /><div><b></b><p></p></div></div>
    <div id="scores" hidden>
      <div id="cast-score" class="score"><span>This cast<br /><small class="muted"></small></span><b></b></div>
      <div id="user-score" class="score"><span>The account<br /><small class="muted"></small></span><b></b></div>
      <p class="muted">Scores come from the Laya model behind <a href="https://spam.quilcast.com" target="_blank" rel="noopener">spam.quilcast.com</a>, which reads every new cast and account.</p>
    </div>
    <p id="status" role="status"></p>
  </main>
</body>
