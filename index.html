<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Quilcast, a Farcaster client for Hypersnap</title>
    <meta name="description" content="Quilcast is a tiny, open Farcaster client that talks straight to the Hypersnap network run by Quilibrium, with your keys kept in your own browser." />
    <link rel="canonical" href="https://quilcast.com/" />
    <!-- the home page arrives with the signed-out feed drawn in (server/home.mjs); a browser that has an account, a
      theme or settings here draws its own page instead, so that one stays hidden (style.css [data-own]). Otherwise
      the page's first picture (its quilcast:lead) is asked for right away, and the app's scripts (held in #app-js)
      and the page's other pictures (data-src, data-poster) once it's on screen: the page is already drawn, and
      they'd only share the line with it. Without that picture to wait for, the scripts are fetched at once. Either way
      they run only once the whole page is parsed: inserted like this they don't wait for it as the page's own would,
      and could start before there's a #app to draw in (Safari, signed in, on a slow line: a blank page). Until the app
      is up (src/crash.ts), its code failing to load says so with a Reload button, and so does an error it doesn't come
      back from within 5 s -->
    <script>try{var s=localStorage,o=['accounts','account','theme','settings','ogre'].some(function(k){return s.getItem('quilcast:'+k)})}catch(e){}var d=document,t=d.getElementById('app-js'),m=d.querySelector('meta[name="quilcast:lead"]'),go=function(){if(t){if(d.readyState=='loading')return d.addEventListener('DOMContentLoaded',go);d.head.append(t.content);t=null;d.querySelectorAll('img[data-src]').forEach(function(i){if(i.dataset.srcset)i.srcset=i.dataset.srcset;i.src=i.dataset.src});d.querySelectorAll('video[data-poster]').forEach(function(v){v.poster=v.dataset.poster})}};if(o)d.documentElement.setAttribute('data-own','');if(o||!m){if(t){t.content.querySelectorAll('link').forEach(function(k){d.head.appendChild(k)});t.content.querySelectorAll('script').forEach(function(x){var k=d.createElement('link');k.rel='modulepreload';k.crossOrigin='';k.href=x.getAttribute('src');d.head.appendChild(k)})}go()}else{var l=d.createElement('link');l.rel='preload';l.as='image';l.fetchPriority='high';l.imageSrcset=m.content;l.imageSizes=m.dataset.sizes;l.onload=l.onerror=function(){requestAnimationFrame(function(){setTimeout(go)})};setTimeout(go,3000);d.head.appendChild(l)}addEventListener('error',function(e){var x=e.target,s=x&&x.tagName=='SCRIPT';if(s||e.error)setTimeout(function(){var h=d.documentElement,b,p,r;if(h.hasAttribute('data-up')||d.querySelector('.crash'))return;b=d.createElement('div');b.className='crash';b.setAttribute('role','alert');p=d.createElement('p');p.textContent='Something went wrong and Quilcast stopped. Reloading the page usually fixes it.';r=d.createElement('button');r.className='btn';r.textContent='Reload';r.onclick=function(){location.reload()};b.append(p,r);(d.body||h).append(b)},s?0:5e3)},true)</script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- the first feed and its avatars come from these, so their connections open while the script loads -->
    <link rel="preconnect" href="https://haatz.quilibrium.com" crossorigin />
    <link rel="preconnect" href="https://imagedelivery.net" />
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0c11" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quilcast" />
    <meta property="og:url" content="https://quilcast.com/" />
    <meta property="og:title" content="Quilcast, a Farcaster client for Hypersnap" />
    <meta property="og:description" content="Read, cast and reply on Farcaster through the Hypersnap network, with no server in between and your keys kept in your browser." />
    <meta property="og:image" content="https://quilcast.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Quilcast: Farcaster on Hypersnap, straight from your browser" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quilcast, a Farcaster client for Hypersnap" />
    <meta name="twitter:description" content="Read, cast and reply on Farcaster through the Hypersnap network, with no server in between and your keys kept in your browser." />
    <meta name="twitter:image" content="https://quilcast.com/og.png" />
    <meta name="twitter:image:alt" content="Quilcast: Farcaster on Hypersnap, straight from your browser" />
    <!-- in Farcaster clients a link is a card that opens Quilcast as a mini app (server/index.mjs fills in each page) -->
    <meta name="fc:miniapp" content="{&quot;version&quot;:&quot;1&quot;,&quot;imageUrl&quot;:&quot;https://quilcast.com/embed.png&quot;,&quot;button&quot;:{&quot;title&quot;:&quot;Open in Quilcast&quot;,&quot;action&quot;:{&quot;type&quot;:&quot;launch_miniapp&quot;,&quot;name&quot;:&quot;Quilcast&quot;,&quot;url&quot;:&quot;https://quilcast.com/&quot;,&quot;splashImageUrl&quot;:&quot;https://quilcast.com/splash.png&quot;,&quot;splashBackgroundColor&quot;:&quot;#0d0c11&quot;}}}" />
    <meta name="fc:frame" content="{&quot;version&quot;:&quot;1&quot;,&quot;imageUrl&quot;:&quot;https://quilcast.com/embed.png&quot;,&quot;button&quot;:{&quot;title&quot;:&quot;Open in Quilcast&quot;,&quot;action&quot;:{&quot;type&quot;:&quot;launch_frame&quot;,&quot;name&quot;:&quot;Quilcast&quot;,&quot;url&quot;:&quot;https://quilcast.com/&quot;,&quot;splashImageUrl&quot;:&quot;https://quilcast.com/splash.png&quot;,&quot;splashBackgroundColor&quot;:&quot;#0d0c11&quot;}}}" />
