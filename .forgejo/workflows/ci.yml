name: CI

# The web app and its server. Changes only to the native apps, their store texts or the release scripts skip it
# (android.yml and ios.yml check those).
on:
  pull_request:
    paths-ignore: ['android/**', 'ios/**', 'contracts/**', '.forgejo/workflows/contracts.yml', 'fastlane/**', 'appstore/**', '.github/scripts/**', '.forgejo/workflows/android.yml', '.forgejo/workflows/ios.yml', '.forgejo/workflows/release.yml', '.forgejo/workflows/store.yml', 'scripts/store-copy.mjs', '*.md']
  push:
    branches: [main]
    paths-ignore: ['android/**', 'ios/**', 'contracts/**', '.forgejo/workflows/contracts.yml', 'fastlane/**', 'appstore/**', '.github/scripts/**', '.forgejo/workflows/android.yml', '.forgejo/workflows/ios.yml', '.forgejo/workflows/release.yml', '.forgejo/workflows/store.yml', 'scripts/store-copy.mjs', '*.md']

# read here; only the publish job, which runs on pushes to main alone, asks for write
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Our own PRs and pushes run on the Mac runners; outsiders' PRs (AGit via the github bot) on Linux
    runs-on: ${{ (github.event_name != 'pull_request' || contains(fromJSON('["backmeupplz","renovate","claude","radiant"]'), github.event.pull_request.user.login)) && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      # All but the store pictures (most of the repo's size). A Mac runner keeps a clone in its tool cache and fetches only
      # what's new into it; Linux fetches just the files it checks out
      - name: Checkout
        if: runner.os == 'macOS'
        env:
          SHA: ${{ github.sha }}
          URL: ${{ github.server_url }}/${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          m="$RUNNER_TOOL_CACHE/quilcast.git"
          [ -d "$m" ] || git init -q --bare "$m"
          git -C "$m" -c http.extraHeader="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64)" fetch -q --no-tags "$URL" "+${SHA}:refs/ci/head"
          find . -mindepth 1 -delete
          git init -q . && echo "$m/objects" > .git/objects/info/alternates
          git sparse-checkout set --no-cone '/*' '!/appstore/' '!/fastlane/'
          git -c advice.detachedHead=false checkout -q --detach "$SHA"
      - if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/appstore/
            !/fastlane/
          sparse-checkout-cone-mode: false
      # The Mac uses Homebrew's node; production is the Dockerfile's node 24
      - if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      # A Mac runner links in its cached install, Linux installs (scripts/ci-install.sh)
      - name: npm ci
        run: sh scripts/ci-install.sh
      # WebKit, Safari's engine, for e2e/; the install is a no-op once the runner has this Playwright's WebKit
      - run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps ' || '' }}webkit
      # Same order as the Dockerfile: the server tests serve dist/
      - run: npm run build
      # Every test file at once (unit, server and the app in WebKit), with the type and locale checks alongside
      - name: Tests, tsc and i18n
        run: |
          npx tsc --noEmit & tsc=$!
          npm run i18n & i18n=$!
          npm test -- e2e/*.test.mjs
          wait $tsc
          wait $i18n

  # The build's hashes (dist/build.json) go to the `builds` branch, which the mirror copies to GitHub, for
  # scripts/verify.mjs (README "Verify this build"). A job of its own, so that only a push to main, whose code is already
  # in main, runs with write access; PR runs never do. After the checks but whether they pass or not, as Tugport's
  # deploy doesn't wait for CI. It builds again, which gives the same bytes (the build is reproducible)
  publish:
    needs: check
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        env:
          SHA: ${{ github.sha }}
          URL: ${{ github.server_url }}/${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          m="$RUNNER_TOOL_CACHE/quilcast.git"
          [ -d "$m" ] || git init -q --bare "$m"
          git -C "$m" -c http.extraHeader="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64)" fetch -q --no-tags "$URL" "+${SHA}:refs/ci/head"
          find . -mindepth 1 -delete
          git init -q . && echo "$m/objects" > .git/objects/info/alternates
          git sparse-checkout set --no-cone '/*' '!/appstore/' '!/fastlane/'
          git -c advice.detachedHead=false checkout -q --detach "$SHA"
      - name: npm ci
        run: sh scripts/ci-install.sh
      - run: npm run build
      - name: Publish the build's hashes
        env:
          SHA: ${{ github.sha }}
          URL: ${{ github.server_url }}/${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: sh scripts/publish-build.sh
